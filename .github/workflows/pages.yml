# 把 spike-sim/（SPIKE 模擬器）部署到 GitHub Pages，學生用網址就能直接使用。
# 第一次使用：到 GitHub 的 Settings → Pages，把 Source 選成「GitHub Actions」。
name: 部署 SPIKE 模擬器

on:
  push:
    branches: [main]
    paths: ['spike-sim/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 檢查必要檔案
        run: |
          for f in index.html sim.js blocks.js pygen.js pyrun.js app.js style.css; do
            test -f "spike-sim/$f" || { echo "缺少 spike-sim/$f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spike-sim
      - id: deployment
        uses: actions/deploy-pages@v4
